name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem web,tools -Recurse -File -Include *.js,*.cjs,*.mjs
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $file" }
          }
      - name: Build application
        run: go build -trimpath -ldflags="-H=windowsgui" -o LampGuide.exe .

  # 容器镜像这条路没有别的检查兜底：只有网关包能编到 linux，只有镜像起来
  # 之后 /health 才会真的应答。两者都在这里跑一遍。
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # 桌面层（internal/shell、internal/native、internal/host）只有 Windows 实现，
      # 所以 linux 上不能 go vet ./...：范围收到网关与无界面入口。
      - name: Vet gateway and headless entry
        run: go vet ./internal/zen/... ./cmd/...
      - name: Build headless gateway for linux
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/lamp-guide-server
      # 多架构：arm64 / armv7 的编译先在这里过一遍，不依赖 buildx。
      - name: Cross-compile for arm64 and armv7
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/lamp-guide-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -o /dev/null ./cmd/lamp-guide-server
      - name: Build image
        run: docker build -t lamp-guide:ci .
      # 下面这些断言都是本地 Windows 机器上验不了的那部分：镜像层、非 root、
      # busybox 探针、容器内的远端管理语义、SIGTERM 收尾。
      - name: Smoke test container
        run: |
          set -euo pipefail
          # 直接 docker build 出来的应该是构建机架构，多架构由 publish 作业负责。
          test "$(docker image inspect --format '{{.Architecture}}' lamp-guide:ci)" = amd64
          docker run -d --name lg -p 8787:8787 lamp-guide:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8787/health | grep -q '"ok":true' && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/health | grep -q '"ok":true'
          echo "--- boot log ---"
          docker logs lg
          # 首次启动必须把 config.json 落到卷目录：那是网关的全部状态。
          docker exec lg sh -c 'test -s /data/config.json'
          # 服务进程不是 root：入口脚本把数据目录交给 10001，落盘的文件就该是 10001 的。
          test "$(docker exec lg stat -c '%u:%g' /data/config.json)" = 10001:10001
          # HEALTHCHECK 要真的翻成 healthy：alpine 里只有 busybox 的 wget，
          # 探针命令写错（比如被 HTTP_PROXY 劫持）会在这里卡成 unhealthy。
          status=starting
          for _ in $(seq 1 24); do
            status=$(docker inspect --format '{{.State.Health.Status}}' lg)
            [ "$status" = healthy ] && break
            sleep 5
          done
          echo "health=$status"
          test "$status" = healthy
          # 鉴权：无 key 401，带卷里的主密钥 200。
          key=$(docker exec lg sh -c "grep -o '\"mainKey\": *\"[^\"]*\"' /data/config.json" | sed 's/.*"\([^"]*\)"$/\1/')
          echo "key length=${#key}"
          test "${#key}" -ge 16
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/v1/models)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" http://127.0.0.1:8787/v1/models)" = 200
          # 管理接口：宿主机访问发布端口时，容器看到的源地址是网桥地址（远端），
          # 所以默认必须拒绝——这正是「容器里管理接口不可用」的预期。
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $key" http://127.0.0.1:8787/admin/api/state)" = 403
          # 同一个远端打开 /admin：状态还是 403，但正文必须是一页说明（写到哪个
          # 环境变量），别再退化成一句 admin is loopback-only 的 JSON。
          test "$(curl -s -o /tmp/admin-off.html -w '%{http_code}' http://127.0.0.1:8787/admin)" = 403
          grep -qi '<html' /tmp/admin-off.html
          grep -q 'ZEN_GATE_ALLOW_REMOTE_ADMIN' /tmp/admin-off.html
          # 回环（容器内部）打开界面资源：直接 200，说明 403 只针对「远端 + 未开 opt-in」。
          docker exec lg wget -qO- http://127.0.0.1:8787/admin/ui/ | grep -qi 'Lamp Guide'
          # SIGTERM：进程要自己收尾并以 0 退出，而不是被 15s 后 SIGKILL 掉（137）。
          docker stop -t 15 lg
          code=$(docker inspect --format '{{.State.ExitCode}}' lg)
          echo "exit code=$code"
          test "$code" = 0
          docker rm lg
      # 卷的属主不对是容器部署最常见的坑：NAS 面板、docker 自动创建、别人留下的目录
      # 往往是 root 或 nobody 属主，网关一启动就 open config.json.tmp: permission denied。
      # 这里用「root 专属目录」和「PUID/PGID 覆盖」两种真实场景把入口脚本钉住。
      - name: Smoke test data directory ownership
        run: |
          set -euo pipefail
          wait_health() {
            for _ in $(seq 1 30); do
              curl -fsS "$1/health" | grep -q '"ok":true' && return 0
              sleep 2
            done
            return 1
          }
          proc_uid() {
            docker exec "$1" sh -c 'grep -m1 "^Uid:" /proc/$(pidof lamp-guide-server)/status | cut -f2'
          }
          # 1) 宿主机上 root:root 0700 的目录，运行用户 10001 本来写不进去。
          mkdir -p permtest
          sudo chown 0:0 permtest
          sudo chmod 0700 permtest
          docker run -d --name lgperm -p 8789:8787 -v "$PWD/permtest:/data" lamp-guide:ci
          wait_health http://127.0.0.1:8789 || { docker logs lgperm; exit 1; }
          # 入口脚本的提示走 stderr，docker logs 要合并两路才 grep 得到。
          docker logs lgperm 2>&1 | grep -q '当前属主 0:0'
          # permtest 是 0700，属主已被入口脚本改成 10001，runner 用户进不去，断言必须借 sudo。
          sudo test -s permtest/config.json
          echo "config.json owner=$(sudo stat -c '%u:%g' permtest/config.json)"
          test "$(sudo stat -c '%u:%g' permtest/config.json)" = 10001:10001
          # 降权之后进程本身是 10001，不是 root。
          test "$(proc_uid lgperm)" = 10001
          docker rm -f lgperm
          # 2) Unraid 那类面板用 PUID/PGID 指定属主：文件与进程都要跟着变。
          mkdir -p permtest2
          docker run -d --name lgperm2 -p 8790:8787 -v "$PWD/permtest2:/data" \
            -e PUID=99 -e PGID=100 lamp-guide:ci
          wait_health http://127.0.0.1:8790 || { docker logs lgperm2; exit 1; }
          echo "config.json owner=$(stat -c '%u:%g' permtest2/config.json)"
          test "$(stat -c '%u:%g' permtest2/config.json)" = 99:100
          echo "server uid=$(proc_uid lgperm2)"
          test "$(proc_uid lgperm2)" = 99
          docker rm -f lgperm2
      - name: Smoke test remote admin and custom key
        run: |
          set -euo pipefail
          docker run -d --name lg2 -p 8788:8787 \
            -e ZEN_GATE_ALLOW_REMOTE_ADMIN=1 \
            -e ZEN_GATE_KEY=ci-custom-key-9f3a1c7b \
            lamp-guide:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8788/health | grep -q '"ok":true' && break
            sleep 2
          done
          echo "--- boot log ---"
          docker logs lg2
          # 自定义主密钥：错 key 401，对 key 200，并且已写进 config.json（重启沿用）。
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer nope' http://127.0.0.1:8788/v1/models)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-custom-key-9f3a1c7b' http://127.0.0.1:8788/v1/models)" = 200
          docker exec lg2 sh -c 'grep -q ci-custom-key-9f3a1c7b /data/config.json'
          # 远端管理：默认拒绝，打开开关后只认主密钥；跨站 POST 仍要被挡住。
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/admin/api/state)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-custom-key-9f3a1c7b' http://127.0.0.1:8788/admin/api/state)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer ci-custom-key-9f3a1c7b' -H 'Origin: http://evil.invalid' http://127.0.0.1:8788/admin/api/reprobe)" = 403
          docker rm -f lg2
      # 容器里没有 WebView2，管理界面靠浏览器跑：这一条钉住「界面资源真的在镜像里、
      # 页面能起来、远端登录能换到会话、会话能用 RPC 拿到数据」。
      - name: Smoke test browser UI
        run: |
          set -euo pipefail
          docker run -d --name lgui -p 8791:8787 \
            -e ZEN_GATE_ALLOW_REMOTE_ADMIN=1 \
            -e ZEN_GATE_KEY=ci-ui-key-0123456789abcdef \
            lamp-guide:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8791/health | grep -q '"ok":true' && break
            sleep 2
          done
          echo "--- boot log ---"
          docker logs lgui
          # 回环（容器自己）打开 /admin：不用登录，直接拿到界面。
          docker exec lgui sh -c 'wget -qO- http://127.0.0.1:8787/admin/ui/ | grep -qi "Lamp Guide"'
          # 远端：登录页而不是 403，说明远端管理开关生效；没会话时 RPC 一律 401。
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8791/admin)" = 200
          curl -s http://127.0.0.1:8791/admin | grep -q '主密钥'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data '{"id":1,"method":"Gateway","payload":{"path":"state"}}' \
            http://127.0.0.1:8791/admin/rpc)" = 401
          # 错密钥 401，正确密钥拿到会话 cookie。
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' --data '{"key":"ofm-wrong"}' \
            http://127.0.0.1:8791/admin/login)" = 401
          jar=$(mktemp)
          test "$(curl -s -o /dev/null -w '%{http_code}' -c "$jar" -X POST \
            -H 'Content-Type: application/json' \
            --data '{"key":"ci-ui-key-0123456789abcdef"}' \
            http://127.0.0.1:8791/admin/login)" = 200
          grep -q lamp_admin "$jar"
          # 带会话：/admin 跳界面目录，静态资源与 RPC 都通，state 里真的有数据。
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" http://127.0.0.1:8791/admin)" = 303
          test "$(curl -s -b "$jar" http://127.0.0.1:8791/admin/ui/js/webbridge.js | wc -c)" -gt 1000
          curl -s -b "$jar" -X POST -H 'Content-Type: application/json' \
            --data '{"id":7,"method":"Gateway","payload":{"path":"state"}}' \
            http://127.0.0.1:8791/admin/rpc | grep -q '"ok":true'
          # 导出走一次性下载令牌：能下载，第二次必须 404。
          token=$(curl -s -b "$jar" -X POST -H 'Content-Type: application/json' \
            --data '{"id":8,"method":"Gateway","payload":{"path":"state","saveTo":"state.json"}}' \
            http://127.0.0.1:8791/admin/rpc | sed 's/.*"download":"\([^"]*\)".*/\1/')
          test -n "$token"
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "http://127.0.0.1:8791/admin/download/$token")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "http://127.0.0.1:8791/admin/download/$token")" = 404
          docker rm -f lgui
      - name: Container logs
        if: failure()
        run: |
          docker ps -a || true
          for c in lg lgperm lgperm2 lg2 lgui; do docker logs "$c" || true; done
          ls -la permtest permtest2 2>/dev/null || true

  # 发布镜像：默认推到 GitHub 自带的容器仓库 GHCR，用 GITHUB_TOKEN，不需要额外配置。
  # 想同时推 Docker Hub：在仓库 Settings → Secrets 里加 DOCKERHUB_USERNAME、DOCKERHUB_TOKEN，
  # 在 Variables 里加 DOCKERHUB_REPO（例如 yourname/lamp-guide），这一段才会真的执行。
  #
  # 一次出三个架构：linux/amd64、linux/arm64、linux/arm/v7（树莓派 32 位）。
  # 构建阶段跑在构建机原生架构上，靠 Go 交叉编译出目标架构二进制，不用 QEMU 模拟编译器。
  # 注意：新仓库第一次发布时 GHCR 的包是私有的，要在仓库 Packages 页面点一次 Public（本仓库已设为 public），或先 docker login ghcr.io。
  publish:
    if: github.event_name == 'push'
    needs: [docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-arch image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO: ${{ vars.DOCKERHUB_REPO }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_SHA::7}"
          platforms="linux/amd64,linux/arm64,linux/arm/v7"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=(-t "$image:latest" -t "$image:$tag")
          if [ -n "${DOCKERHUB_TOKEN:-}" ] && [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_REPO:-}" ]; then
            echo "== 同时推 Docker Hub: $DOCKERHUB_REPO =="
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            tags+=(-t "$DOCKERHUB_REPO:latest" -t "$DOCKERHUB_REPO:$tag")
          else
            echo "没有 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN / DOCKERHUB_REPO，跳过 Docker Hub 推送"
          fi
          echo "== 构建并推送 $platforms =="
          docker buildx build --platform "$platforms" "${tags[@]}" --push .
          echo "== 镜像清单 =="
          docker buildx imagetools inspect "$image:$tag"
